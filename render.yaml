# Render Blueprint for Vignan Vidyanikethan AI.
# Free web service: sleeps after inactivity, so use Supabase for persistent data.
# Add the secret values marked sync:false in the Render dashboard.

services:
  - type: web
    name: vignan-vidyanikethan-ai
    env: node
    plan: free
    region: singapore
    buildCommand: npm run precache
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: STUDY_AI_FREE_ROUTER
        value: "true"
      - key: STUDY_AI_FREE_ROUTER_ORDER
        value: gemini,groq,cloudflare,openrouter,mistral,cohere,arena,primary
      - key: STUDY_AI_ACCOUNTS_BACKEND
        value: supabase
      - key: STUDY_AI_COOKIE_SECURE
        value: "true"
      - key: STUDY_AI_GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: STUDY_AI_GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: STUDY_AI_CLOUDFLARE_MODEL
        value: "@cf/openai/gpt-oss-20b"
      - key: STUDY_AI_OPENROUTER_MODEL
        value: openrouter/free
      - key: STUDY_AI_MISTRAL_MODEL
        value: open-mistral-nemo
      - key: STUDY_AI_COHERE_MODEL
        value: command-r-08-2024
      - key: STUDY_AI_ARENA_MODEL
        value: coding-router-preview
      - key: STUDY_AI_SUPABASE_EMAIL_DOMAIN
        value: students.vignanvidyanikethan.org

      # Secrets: paste these in Render → Environment. Never commit them.
      - key: STUDY_AI_GEMINI_KEY
        sync: false
      - key: STUDY_AI_GROQ_KEY
        sync: false
      - key: STUDY_AI_CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: STUDY_AI_CLOUDFLARE_TOKEN
        sync: false
      - key: STUDY_AI_OPENROUTER_KEY
        sync: false
      - key: STUDY_AI_MISTRAL_KEY
        sync: false
      - key: STUDY_AI_COHERE_KEY
        sync: false
      - key: STUDY_AI_ARENA_KEY
        sync: false
      - key: STUDY_AI_OPENROUTER_REFERER
        sync: false
      - key: SUPABASE_URL
        value: https://dwmzbrrnqxzdoxrxbrna.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STUDY_AI_ALLOWED_ORIGINS
        sync: false
